<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dnsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="firewallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sslGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a18cd1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbc2eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4facfe"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#43e97b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff">
    What Happens When You Type https://www.google.com and Press Enter
  </text>
  
  <!-- User/Browser Box -->
  <rect x="30" y="280" width="120" height="100" rx="10" fill="url(#userGrad)" filter="url(#shadow)"/>
  <text x="90" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">USER</text>
  <text x="90" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff">Browser</text>
  <text x="90" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ddd">Types URL</text>
  
  <!-- DNS Server -->
  <rect x="30" y="100" width="120" height="80" rx="10" fill="url(#dnsGrad)" filter="url(#shadow)"/>
  <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">DNS SERVER</text>
  <text x="90" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Resolves domain</text>
  <text x="90" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">to IP address</text>
  
  <!-- DNS Arrow -->
  <path d="M 90 280 L 90 185" stroke="#f093fb" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="100" y="235" font-family="Arial, sans-serif" font-size="9" fill="#f093fb">1. DNS Query</text>
  
  <!-- Internet Cloud -->
  <ellipse cx="280" cy="330" rx="70" ry="40" fill="#2d3561" stroke="#4facfe" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">INTERNET</text>
  <text x="280" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#aaa">TCP/IP</text>
  
  <!-- Arrow to Internet -->
  <path d="M 150 330 L 205 330" stroke="#4facfe" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="165" y="320" font-family="Arial, sans-serif" font-size="9" fill="#4facfe">2. TCP/IP</text>
  
  <!-- HTTPS/SSL Encryption Box -->
  <rect x="380" y="280" width="100" height="100" rx="10" fill="url(#sslGrad)" filter="url(#shadow)"/>
  <text x="430" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">HTTPS/SSL</text>
  <text x="430" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">TLS Handshake</text>
  <text x="430" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">🔒 Encrypted</text>
  <text x="430" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Port 443</text>
  
  <!-- Arrow to SSL -->
  <path d="M 350 330 L 375 330" stroke="#43e97b" stroke-width="2" fill="none" marker-end="url(#arrowheadGreen)"/>
  <text x="355" y="320" font-family="Arial, sans-serif" font-size="9" fill="#43e97b">3</text>
  
  <!-- Firewall -->
  <rect x="510" y="280" width="90" height="100" rx="10" fill="url(#firewallGrad)" filter="url(#shadow)"/>
  <text x="555" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">FIREWALL</text>
  <text x="555" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Security</text>
  <text x="555" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Check</text>
  <text x="555" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1a1a2e">🛡️</text>
  
  <!-- Arrow to Firewall -->
  <path d="M 480 330 L 505 330" stroke="#fa709a" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="485" y="320" font-family="Arial, sans-serif" font-size="9" fill="#fa709a">4</text>
  
  <!-- Load Balancer -->
  <rect x="630" y="280" width="100" height="100" rx="10" fill="url(#lbGrad)" filter="url(#shadow)"/>
  <text x="680" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">LOAD</text>
  <text x="680" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">BALANCER</text>
  <text x="680" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Distributes</text>
  <text x="680" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Traffic</text>
  <text x="680" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a1a2e">⚖️</text>
  
  <!-- Arrow to Load Balancer -->
  <path d="M 600 330 L 625 330" stroke="#4facfe" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="605" y="320" font-family="Arial, sans-serif" font-size="9" fill="#4facfe">5</text>
  
  <!-- Web Server -->
  <rect x="760" y="200" width="110" height="80" rx="10" fill="url(#webGrad)" filter="url(#shadow)"/>
  <text x="815" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">WEB SERVER</text>
  <text x="815" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Nginx/Apache</text>
  <text x="815" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">HTTP Handler</text>
  
  <!-- Web Server 2 -->
  <rect x="760" y="380" width="110" height="80" rx="10" fill="url(#webGrad)" filter="url(#shadow)"/>
  <text x="815" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">WEB SERVER</text>
  <text x="815" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Nginx/Apache</text>
  <text x="815" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">HTTP Handler</text>
  
  <!-- Arrows from LB to Web Servers -->
  <path d="M 730 310 L 755 260" stroke="#a8edea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 730 350 L 755 400" stroke="#a8edea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="735" y="290" font-family="Arial, sans-serif" font-size="9" fill="#a8edea">6</text>
  
  <!-- Application Server -->
  <rect x="910" y="200" width="120" height="80" rx="10" fill="url(#appGrad)" filter="url(#shadow)"/>
  <text x="970" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">APPLICATION</text>
  <text x="970" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">SERVER</text>
  <text x="970" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Business Logic</text>
  <text x="970" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Page Generation</text>
  
  <!-- Application Server 2 -->
  <rect x="910" y="380" width="120" height="80" rx="10" fill="url(#appGrad)" filter="url(#shadow)"/>
  <text x="970" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">APPLICATION</text>
  <text x="970" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">SERVER</text>
  <text x="970" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Business Logic</text>
  <text x="970" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Page Generation</text>
  
  <!-- Arrows from Web to App Server -->
  <path d="M 870 240 L 905 240" stroke="#ff9a9e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 870 420 L 905 420" stroke="#ff9a9e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="880" y="235" font-family="Arial, sans-serif" font-size="9" fill="#ff9a9e">7</text>
  
  <!-- Database -->
  <rect x="1050" y="290" width="120" height="90" rx="10" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="1110" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">DATABASE</text>
  <text x="1110" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">MySQL/PostgreSQL</text>
  <text x="1110" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Data Storage</text>
  <text x="1110" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a1a2e">🗄️</text>
  
  <!-- Arrows from App Server to Database -->
  <path d="M 1030 250 L 1080 285" stroke="#a18cd1" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1030 410 L 1080 375" stroke="#a18cd1" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="1045" y="300" font-family="Arial, sans-serif" font-size="9" fill="#a18cd1">8</text>
  
  <!-- Google Cloud Label -->
  <rect x="620" y="150" width="560" height="370" rx="15" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="900" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4facfe">GOOGLE'S INFRASTRUCTURE</text>
  
  <!-- Legend -->
  <rect x="30" y="520" width="1140" height="160" rx="10" fill="#252547" filter="url(#shadow)"/>
  <text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">REQUEST FLOW LEGEND</text>
  
  <circle cx="60" cy="575" r="8" fill="#f093fb"/>
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="11" fill="#fff">1. DNS Resolution - Domain name translated to IP address</text>
  
  <circle cx="60" cy="600" r="8" fill="#4facfe"/>
  <text x="80" y="605" font-family="Arial, sans-serif" font-size="11" fill="#fff">2. TCP/IP Connection - Three-way handshake establishes connection</text>
  
  <circle cx="60" cy="625" r="8" fill="#43e97b"/>
  <text x="80" y="630" font-family="Arial, sans-serif" font-size="11" fill="#fff">3. HTTPS/SSL - TLS handshake encrypts all traffic (Port 443)</text>
  
  <circle cx="60" cy="650" r="8" fill="#fa709a"/>
  <text x="80" y="655" font-family="Arial, sans-serif" font-size="11" fill="#fff">4. Firewall - Security check filters malicious requests</text>
  
  <circle cx="600" cy="575" r="8" fill="#4facfe"/>
  <text x="620" y="580" font-family="Arial, sans-serif" font-size="11" fill="#fff">5. Load Balancer - Distributes traffic across multiple servers</text>
  
  <circle cx="600" cy="600" r="8" fill="#a8edea"/>
  <text x="620" y="605" font-family="Arial, sans-serif" font-size="11" fill="#fff">6. Web Server - Handles HTTP requests, serves static content</text>
  
  <circle cx="600" cy="625" r="8" fill="#ff9a9e"/>
  <text x="620" y="630" font-family="Arial, sans-serif" font-size="11" fill="#fff">7. Application Server - Processes business logic, generates page</text>
  
  <circle cx="600" cy="650" r="8" fill="#a18cd1"/>
  <text x="620" y="655" font-family="Arial, sans-serif" font-size="11" fill="#fff">8. Database - Stores and retrieves user data and content</text>
</svg>
